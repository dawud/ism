name: Verify and Extract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-extract:
    name: Verify F* and extract C
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned toolchain image
        run: docker build -t localhost/verified-dns-server:latest -f Containerfile .

      - name: Verify F* sources
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make verify'

      - name: Extract C smoke test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make extract'
