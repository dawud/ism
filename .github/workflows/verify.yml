name: Verify and Extract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-extract:
    name: Verify F* and extract C
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned toolchain image
        run: docker build -t localhost/verified-dns-server:latest -f Containerfile .

      - name: Verify F* sources
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make verify'

      - name: Verify EverParse generated subset
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make everparse-verify'

      - name: Extract C smoke test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make extract'

  latest-fstar-migration:
    name: Latest F* migration lane
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve latest F* release
        run: |
          LATEST_FSTAR_VERSION="$(curl -fsSL https://api.github.com/repos/FStarLang/FStar/releases/latest | sed -n 's/.*"tag_name": "\(v[^"]*\)".*/\1/p' | head -n1)"
          if [ -z "${LATEST_FSTAR_VERSION}" ]; then
            LATEST_FSTAR_VERSION="v2026.05.10"
          fi
          echo "FSTAR_VERSION=${LATEST_FSTAR_VERSION}" >> "${GITHUB_ENV}"
          echo "Using F* ${LATEST_FSTAR_VERSION} for the migration lane"

      - name: Build latest F* migration image
        run: docker build --build-arg FSTAR_VERSION="${FSTAR_VERSION}" -t localhost/verified-dns-server:fstar-migration -f Containerfile.migration .

      - name: Verify against latest F*
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:fstar-migration \
            bash -lc 'cd /workspace && make verify-pulse-pilot && make assess-pulse-pilot-rust && make verify'
