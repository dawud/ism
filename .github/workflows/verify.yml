name: Verify and Extract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-extract:
    name: Verify F* and extract C
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned toolchain image
        run: docker build -t localhost/verified-dns-server:latest -f Containerfile .

      - name: Verify F* sources
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make verify'

      - name: Verify EverParse generated subset
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make everparse-verify'

      - name: Extract C smoke test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make extract'

      - name: Syntax-check real MsQuic callback wrappers
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-compile-smoke'

      - name: Check MsQuic connection callback behavior
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-connection-smoke'

      - name: Link real MsQuic runtime library
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-link-smoke'

      - name: Check real MsQuic object lifecycle
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-lifecycle-smoke'

      - name: Start real MsQuic listener
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-listener-smoke'

      - name: Exchange real MsQuic query and response
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest \
            bash -lc 'cd /workspace && make msquic-runtime-stream-smoke'

      - name: Build pinned Pulse image for mixed C integration
        run: docker build -t localhost/verified-dns-server:pulse-candidate -f Containerfile.candidate .

      - name: Verify, extract and test the real Pulse stream archive
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:pulse-candidate

      - name: Test C and live MsQuic with Pulse ingress selected
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:latest make pulse-integration-check

      - name: Retain mixed Pulse C integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-integration-evidence
          path: |
            dist/pulse-integration-*/
            obj/pulse-integration-*/
            dist/candidate-*/pulse-stream/

  pulse-candidate:
    name: Pinned Pulse candidate (M1–M3 and M4 table slice)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test migration gate checks
        run: python3 -m unittest discover -s migration/tests -v

      - name: Build pinned candidate image
        run: docker build -t localhost/verified-dns-server:pulse-candidate -f Containerfile.candidate .

      - name: Check inventory, verify stream/table and pilots, extract and test C
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:pulse-candidate

      - name: Retain candidate provenance and generated C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-candidate-evidence
          path: dist/candidate-*/
          if-no-files-found: warn

  latest-fstar-migration:
    name: Latest F* migration lane
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve latest F* release
        run: |
          RELEASE="$(curl -fsSL https://api.github.com/repos/FStarLang/FStar/releases/latest)"
          LATEST_FSTAR_VERSION="$(jq -er '.tag_name' <<< "$RELEASE")"
          ARCHIVE="fstar-${LATEST_FSTAR_VERSION}-Linux-x86_64.tar.gz"
          DIGEST="$(jq -er --arg archive "$ARCHIVE" '.assets[] | select(.name == $archive) | .digest' <<< "$RELEASE")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "FSTAR_VERSION=${LATEST_FSTAR_VERSION}" >> "${GITHUB_ENV}"
          echo "FSTAR_SHA256=${DIGEST#sha256:}" >> "${GITHUB_ENV}"
          echo "Using F* ${LATEST_FSTAR_VERSION} for the migration lane"

      - name: Build latest F* migration image
        run: docker build --build-arg FSTAR_VERSION="${FSTAR_VERSION}" --build-arg FSTAR_SHA256="${FSTAR_SHA256}" -t localhost/verified-dns-server:fstar-migration -f Containerfile.migration .

      - name: Verify pilots against latest F*
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:fstar-migration \
            make verify-pulse-pilot

      - name: Probe legacy compatibility independently
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:fstar-migration \
            make verify

      - name: Assess experimental Rust independently
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/workspace" \
            localhost/verified-dns-server:fstar-migration \
            make pulse-rust-smoke
